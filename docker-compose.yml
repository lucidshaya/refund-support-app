services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: refund_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./refunds.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: refund_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
